root = "."
tmp_dir = "tmp"

[build]
  # Build the API entrypoint into tmp/ and run it.
  cmd = "go build -o ./tmp/api ./cmd/api"
  entrypoint = ["./tmp/api"]
  # Watch Go sources; rebuild on change.
  include_ext = ["go", "env"]
  exclude_dir = ["tmp", "bin", "vendor", "internal/models"]
  exclude_regex = ["_test\\.go"]
  # Also reload when .env changes so config edits take effect.
  include_file = [".env"]
  delay = 800
  stop_on_error = true
  kill_delay = "2s"
  send_interrupt = true

[log]
  time = true

[misc]
  clean_on_exit = true
